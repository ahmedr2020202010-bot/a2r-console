name: Build A2R Console Lite (Windows exe)

on:
  push:
    branches: [lite]
    tags: ['lite-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lite.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lite.txt

      - name: Verify libraries
        run: python -c "import customtkinter, PIL, pystray, openpyxl, reportlab, arabic_reshaper, bidi, pypdf; print('Lite libs OK')"

      - name: Verify required files
        shell: pwsh
        run: |
          foreach ($f in 'collect.py','app.ico','pdftotext.exe') {
            if (-not (Test-Path $f)) { Write-Error "Missing required file: $f"; exit 1 }
          }
          if (-not (Test-Path 'SumatraPDF.exe')) {
            Write-Warning "SumatraPDF.exe not found: silent 57x90 printing will fall back to default printing."
          }

      - name: Syntax check
        run: python -m py_compile collect.py

      - name: Build exe with PyInstaller
        shell: pwsh
        run: |
          $pyArgs = @(
            '--clean','--noconsole','--onefile',
            '--icon=app.ico',
            '--add-binary','pdftotext.exe;.',
            '--add-data','app.ico;.',
            '--collect-all','customtkinter',
            '--collect-all','reportlab',
            '--collect-all','arabic_reshaper',
            '--collect-all','bidi',
            '--collect-all','pystray',
            '--collect-all','PIL',
            '--hidden-import','pystray._win32',
            '--hidden-import','pypdf',
            '--hidden-import','openpyxl',
            '--hidden-import','hmac',
            '--name','A2R_Console_Lite'
          )
          if (Test-Path 'SumatraPDF.exe') { $pyArgs += @('--add-binary','SumatraPDF.exe;.') }
          $pyArgs += 'collect.py'
          python -m PyInstaller @pyArgs

      # نسخة احتياطية من الـ exe تتحمّل من صفحة الـ Run نفسها حتى لو نشر الـ Release فشل
      - name: Upload exe as workflow artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: A2R_Console_Lite
          path: dist/A2R_Console_Lite.exe
          retention-days: 1

      - name: Publish GitHub Release (manual tag lite-v*)
        if: startsWith(github.ref, 'refs/tags/lite-v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/A2R_Console_Lite.exe

      # بتنشر باسم lite-رقم عشان متتداخلش مع Releases النسخة الكاملة (build-رقم) ومتاخدش مكان "Latest"
      - name: Publish GitHub Release (automatic)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lite-${{ github.run_number }}
          name: A2R Console Lite build ${{ github.run_number }} (${{ github.ref_name }})
          target_commitish: ${{ github.sha }}
          make_latest: false
          body: |
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
          files: dist/A2R_Console_Lite.exe

      - name: Keep only the newest 10 lite releases
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = '${{ github.repository }}'
          $rels = gh release list --repo $repo --limit 100 --json tagName,createdAt | ConvertFrom-Json | Where-Object { $_.tagName -like 'lite-*' } | Sort-Object createdAt -Descending
          $rels | Select-Object -Skip 10 | ForEach-Object { gh release delete $_.tagName --repo $repo --cleanup-tag --yes }
