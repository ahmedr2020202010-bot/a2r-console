name: Build A2R Console (Windows exe)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Tesseract and stage it for bundling
        shell: pwsh
        run: |
          choco install tesseract -y --no-progress
          $src = $null
          foreach ($c in 'C:\Program Files\Tesseract-OCR','C:\Program Files (x86)\Tesseract-OCR') {
            if (Test-Path (Join-Path $c 'tesseract.exe')) { $src = $c; break }
          }
          if (-not $src) { Write-Error "tesseract.exe not found after install"; exit 1 }
          New-Item -ItemType Directory -Force -Path tesseract | Out-Null
          Copy-Item -Path (Join-Path $src '*') -Destination tesseract -Recurse -Force
          # keep only the English model to keep the exe small
          Get-ChildItem tesseract\tessdata -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -ne 'eng.traineddata' -and $_.Name -ne 'pdf.ttf' } | Remove-Item -Force
          Get-ChildItem tesseract -Filter 'unins*' -ErrorAction SilentlyContinue | Remove-Item -Force
          if (-not (Test-Path 'tesseract\tesseract.exe')) { Write-Error "tesseract\tesseract.exe missing"; exit 1 }
          if (-not (Test-Path 'tesseract\tessdata\eng.traineddata')) { Write-Error "eng.traineddata missing"; exit 1 }
          & .\tesseract\tesseract.exe --version

      - name: Verify OCR libraries are installed
        run: python -c "from rapidocr_onnxruntime import RapidOCR; import pypdfium2, onnxruntime; RapidOCR(); print('OCR OK')"

      - name: Verify POS engine libraries
        run: python -c "import cv2, numpy, pypdf, openpyxl, PIL, pypdfium2; print('POS libs OK', cv2.__version__)"

      - name: Verify required files
        shell: pwsh
        run: |
          foreach ($f in 'collect.py','app.ico','pdftotext.exe') {
            if (-not (Test-Path $f)) { Write-Error "Missing required file: $f"; exit 1 }
          }
          if (-not (Test-Path 'SumatraPDF.exe')) {
            Write-Warning "SumatraPDF.exe not found: silent 57x90 printing will fall back to default printing."
          }

      - name: Syntax check
        run: python -m py_compile collect.py

      - name: Build exe with PyInstaller
        shell: pwsh
        run: |
          $pyArgs = @(
            '--clean','--noconsole','--onefile',
            '--icon=app.ico',
            '--add-binary','pdftotext.exe;.',
            '--add-data','app.ico;.',
            '--add-data','tesseract;tesseract',
            '--collect-all','customtkinter',
            '--collect-all','reportlab',
            '--collect-all','arabic_reshaper',
            '--collect-all','bidi',
            '--collect-all','pystray',
            '--collect-all','PIL',
            '--collect-all','rapidocr_onnxruntime',
            '--collect-all','onnxruntime',
            '--collect-all','pypdfium2',
            '--hidden-import','pystray._win32',
            '--hidden-import','cv2',
            '--hidden-import','numpy',
            '--hidden-import','pypdf',
            '--hidden-import','openpyxl',
            '--hidden-import','hmac',
            '--name','A2R_Console'
          )
          if (Test-Path 'SumatraPDF.exe') { $pyArgs += @('--add-binary','SumatraPDF.exe;.') }
          # قالب إكسيل التقفيل (الاسكندريه 00.xlsx): لو موجود في الريبو بيتضم جوه الـ exe تلقائياً
          $tpl = Get-ChildItem -File -Filter '*00.xlsx' | Where-Object { $_.Name -notlike '~*' } | Select-Object -First 1
          if ($tpl) { Write-Host "Bundling template: $($tpl.Name)"; $pyArgs += @('--add-data', ($tpl.Name + ';.')) }
          else { Write-Warning "Closing template (*00.xlsx) not found in repo root: users must pick it from the Closing window." }
          $pyArgs += 'collect.py'
          python -m PyInstaller @pyArgs

      # نشر تلقائي في Releases (مفيش حاجة تتعمل يدوي): كل بناء بيتحط له Release باسم build-رقم
      # - من main: Release عادي (Latest). - من أي فرع تانٍ (Run workflow): Pre-release للتجربة.
      - name: Publish GitHub Release (manual tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/A2R_Console.exe

      - name: Publish GitHub Release (automatic)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: A2R Console build ${{ github.run_number }} (${{ github.ref_name }})
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.ref_name != 'main' }}
          make_latest: ${{ github.ref_name == 'main' }}
          body: |
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
          files: dist/A2R_Console.exe

      - name: Keep only the newest 10 releases
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = '${{ github.repository }}'
          $rels = gh release list --repo $repo --limit 100 --json tagName,createdAt | ConvertFrom-Json | Where-Object { $_.tagName -like 'build-*' } | Sort-Object createdAt -Descending
          $rels | Select-Object -Skip 10 | ForEach-Object { gh release delete $_.tagName --repo $repo --cleanup-tag --yes }
